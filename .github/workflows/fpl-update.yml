name: FPL weekly update
 
on:
  schedule:
    # 08:00 UTC daily = 9am BST / 8am GMT.
    # The script is idempotent, so the winter hour shift is harmless:
    # it only writes when a new gameweek has actually finished.
    - cron: "0 8 * * *"
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: fpl-update
  cancel-in-progress: false
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Rebuild data.json from the FPL API
        id: fpl
        run: python scripts/update_fpl.py
 
      - name: Commit and push
        if: steps.fpl.outputs.updated == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- data.json; then
            echo "data.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage data.json ONLY - index.html is never touched.
          git add data.json
          git commit -m "GW${{ steps.fpl.outputs.gw }} update"
          git push
 
